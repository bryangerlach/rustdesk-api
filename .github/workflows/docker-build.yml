name: Docker Build (fork with local frontend)

on:
  workflow_dispatch:
    inputs:
      IMAGE_REGISTRY:
        description: 'Registry (default GitHub Container Registry)'
        required: false
        default: 'ghcr.io'
      IMAGE_NAME:
        description: 'Image name (default repo name)'
        required: false
        default: ''
      PUSH:
        description: 'Push image to registry'
        required: false
        default: 'true'
      WEB_REPO:
        description: 'Web frontend repository (default: <owner>/rustdesk-api-web)'
        required: false
        default: ''
      WEB_BRANCH:
        description: 'Web frontend branch'
        required: false
        default: 'client-builder'
  push:
    branches:
      - client-builder
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout web frontend branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.WEB_REPO || format('{0}/rustdesk-api-web', github.repository_owner) }}
          ref: ${{ github.event.inputs.WEB_BRANCH || 'client-builder' }}
          path: resources/rustdesk-api-web

      # Dockerfile.dev builds both the Go backend and the bundled frontend
      # from resources/rustdesk-api-web, so no separate build steps are needed.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event.inputs.PUSH != 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push full-s6 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_full_s6.dev
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:full-s6-dev

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          platforms: linux/amd64
          push: ${{ github.event.inputs.PUSH != 'false' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            GO_VERSION=1.23
            BUILDARCH=amd64